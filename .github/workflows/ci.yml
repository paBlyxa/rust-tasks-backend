name: CI
on: [push, pull_request]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --bins --all-features

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: secret
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx database create && sqlx migrate run
      - name: Run integration tests
        run: cargo test --tests --all-features

  sqlx-prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx database create && sqlx migrate run
      - name: Chect that .sqlx query cache is up to date
        run: cargo sqlx prepare --check --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: secret
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      - name: Run migrations
        run: sqlx database create && sqlx migrate run
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --workspace --all-features --lib --bins --tests --timeout 120 --out Xml --out Html --output-dir coverage
      - name: Extract coverage percentage
        id: coverage
        run: |
          LINE_RATE=$(grep -m1 -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml)
          if [ -z "$LINE_RATE" ]; then
            echo "Could not parse line-rate from cobertura.xml"; cat coverage/cobertura.xml; exit 1
          fi
          PCT=$(echo "$LINE_RATE * 100" | bc -l)
          PCT_ROUNDED=$(printf "%.1f" "$PCT")
          echo "percentage=$PCT_ROUNDED" >> "$GITHUB_OUTPUT"
      - name: Pick bage color
        id: color
        run: |
          PCT=${{ steps.coverage.outputs.percentage }}
          if (( $(echo "$PCT >= 80" | bc -l) )); then COLOR=brighgreen
          elif (( $(echo "$PCT >= 50" | bc -l) )); then COLOR=yellow
          else COLOR=red
          fi
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge gist
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c845a62912735c6e5ae03e86740b5163
          filename: rust-tasks-backend-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.color.outputs.color }}
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
